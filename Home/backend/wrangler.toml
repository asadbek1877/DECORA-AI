name = "ai-interior-backend"
main = "dist/server.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[env.development]
name = "ai-interior-backend-dev"
# Local SQLite via LibSQL for development

[env.production]
name = "ai-interior-backend"
route = "api.youromain.com/*"
zone_id = "your-zone-id"

# Bindings
[env.production.vars]
ENVIRONMENT = "production"
NODE_ENV = "production"

# Cloudflare D1 Database binding
[[env.production.d1_databases]]
binding = "db"
database_name = "ai-interior"
database_id = "your-database-id"
# Get database_id from: wrangler d1 list

[build]
command = "npm run build"
cwd = "."
watch_paths = ["src/**/*.ts"]

[build.upload]
format = "modules"
main = "./dist/server.js"
